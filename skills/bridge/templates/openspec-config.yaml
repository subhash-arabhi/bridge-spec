schema: spec-driven

# Written by the bridge skill on first T2 change in a repo. Edit freely.
context: |
  Changes are run by the bridge workflow: OpenSpec owns WHAT (proposal + delta specs),
  design.md holds the approved technical design, tasks.md is the implementation plan
  and the only completion record. Tests are written before implementation (strict TDD).

rules:
  proposal:
    - Keep it under 20 lines - Why (2-3 lines), What Changes (bullets plus an out-of-scope line), and an optional Approach (3-8 lines).
  specs:
    - One SHALL or MUST sentence per requirement, with 1-2 "#### Scenario:" blocks (WHEN/THEN bullets). No prose sections.
    - MODIFIED requirements contain the full new requirement text.
  design:
    - Write it only for schema, public API, security, concurrency, cross-module changes, or more than 3 slices. Keep it under 80 lines.
  tasks:
    - Write vertical slices of 15-30 minutes each - "- [ ] <group>.<n> <title>", then at most 6 indented lines - Files, Spec, Test, Size, Risk, and Depends if needed.
    - No step-by-step recipes or code bodies. Every scenario appears in some slice's Spec or Test line.
